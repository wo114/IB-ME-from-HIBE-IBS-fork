<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>IB-ME · 身份匹配演示</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div class="app">
    <header class="masthead">
      <a class="wordmark" href="/" aria-label="IB-ME 演示首页">IB-ME<span>身份基匹配加密</span></a>
      <nav class="tabs" aria-label="页面">
        <button type="button" class="tab active" data-view="demo" aria-pressed="true">演示</button>
        <button type="button" class="tab" data-view="records" aria-pressed="false">运行记录</button>
      </nav>
      <div class="connection" id="connection" role="status"><i></i><span>连接中</span></div>
    </header>

    <div class="error-banner" id="errorBanner" role="alert" hidden>
      <span id="errorText"></span>
      <button type="button" class="text-button" id="reconnectBtn" hidden>重新连接</button>
      <button type="button" class="dismiss" id="dismissError" aria-label="关闭错误提示">×</button>
    </div>

    <div class="layout" id="demoView">
      <aside class="sidebar" aria-label="演示设置">
        <div class="section-label">方案</div>
        <div class="presets" id="presets" aria-label="三组代表方案"></div>
        <details class="extras" id="extras">
          <summary>补充方案</summary>
          <div id="extraPresets" class="presets"></div>
        </details>

        <div class="identity-section">
          <div class="section-label">身份</div>
          <label class="field" for="senderName"><span>发送者</span><input id="senderName" value="Alice" autocomplete="off" spellcheck="false"></label>
          <label class="field" for="receiverName"><span>接收者</span><input id="receiverName" value="Bob" autocomplete="off" spellcheck="false"></label>
          <details class="test-identity">
            <summary>错配测试身份</summary>
            <label class="field" for="wrongName"><span class="sr-only">错配测试身份</span><input id="wrongName" value="Carol" autocomplete="off" spellcheck="false"></label>
          </details>
        </div>

        <div class="session-actions">
          <p class="check-status" id="checkStatus" role="status">正在读取方案</p>
          <p class="wait-note" id="waitNote" hidden></p>
          <button type="button" class="button primary full" id="startBtn" disabled>开始演示</button>
          <button type="button" class="text-button reset" id="resetBtn" hidden>结束当前会话</button>
        </div>
      </aside>

      <main class="workspace" id="workspace">
        <div class="workspace-heading">
          <div><p class="eyebrow" id="schemeCaption">方案 A</p><h1>消息加密与验证</h1></div>
          <span class="session-status" id="sessionStatus">未开始</span>
        </div>
        <div class="route-line"><span id="routeSender">Alice</span><span class="route-arrow" aria-hidden="true">→</span><span id="routeReceiver">Bob</span><span class="route-caption">双方身份匹配时恢复消息</span></div>

        <div class="job-status" id="jobStatus" role="status" aria-live="polite" hidden>
          <span class="spinner" aria-hidden="true"></span><span id="jobPhase">正在执行</span><span class="elapsed" id="jobElapsed">0 s</span>
        </div>

        <div class="workbench">
          <section class="message-pane" aria-labelledby="messageHeading">
            <div class="pane-heading"><h2 id="messageHeading">原始消息</h2><span id="messageCount" class="byte-count">0 B</span></div>
            <label class="sr-only" for="message">待加密消息</label>
            <textarea id="message" spellcheck="false" placeholder="输入一条消息">周五下午三点，实验室见。</textarea>
            <div class="pane-footer"><button type="button" class="button primary" id="encryptBtn" disabled>加密消息 <span aria-hidden="true">↗</span></button><span class="quiet" id="messageLimit"></span></div>
          </section>

          <section class="result-pane" aria-labelledby="resultHeading">
            <div class="pane-heading"><h2 id="resultHeading">解密结果</h2><span id="resultLabel" class="result-label"></span></div>
            <div class="result-content" id="resultContent" aria-live="polite"><p class="empty-state">开始演示，加密一条消息。</p></div>
            <div class="decrypt-toolbar">
              <label class="sr-only" for="testMode">验证情形</label>
              <select id="testMode" disabled>
                <option value="normal">双方身份正确</option>
                <option value="wrong_sender">发送者不匹配</option>
                <option value="wrong_receiver">接收者不匹配</option>
                <option value="both_wrong">双方身份都不匹配</option>
                <option value="tamper">篡改密文 1 bit</option>
                <option value="truncate">截断密文 1 字节</option>
              </select>
              <button type="button" class="button secondary" id="decryptBtn" disabled>解密验证</button>
            </div>
          </section>
        </div>

        <div class="cipher-line" id="cipherLine"><span id="cipherStatus">尚未生成密文</span><code id="cipherDigest"></code></div>
        <div class="measurements" aria-label="本次测量">
          <div><span class="measure-label">密文大小</span><span class="measure-value" id="metricCipher">—</span></div>
          <div><span class="measure-label">加密耗时</span><span class="measure-value" id="metricEncrypt">—</span></div>
          <div><span class="measure-label">解密耗时</span><span class="measure-value" id="metricDecrypt">—</span></div>
        </div>

        <details class="technical" id="technical">
          <summary>参数与更多指标</summary>
          <dl class="parameter-grid" id="parameterGrid"></dl>
          <details class="raw-parameters"><summary>完整配置</summary><pre id="rawParameters">尚未读取配置。</pre></details>
        </details>
        <p class="session-footnote">刷新可继续当前会话；关闭或重启服务后，需重新开始。</p>
      </main>
    </div>

    <main class="records-view" id="recordsView" hidden>
      <div class="workspace-heading"><div><p class="eyebrow">当前会话</p><h1>运行记录</h1></div><button type="button" class="button secondary" id="exportBtn" disabled>导出 JSON <span aria-hidden="true">↓</span></button></div>
      <div class="table-wrap"><table><caption class="sr-only">本次会话的实际操作与结果</caption><thead><tr><th scope="col">操作</th><th scope="col">情形</th><th scope="col">耗时</th><th scope="col">结果</th></tr></thead><tbody id="recordsBody"><tr><td colspan="4" class="empty-records">开始演示后，这里会记录每次操作。</td></tr></tbody></table></div>
    </main>
  </div>
</body>
</html>
