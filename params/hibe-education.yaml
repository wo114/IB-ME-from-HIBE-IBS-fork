# IB-ME HIBE 调试参数（纯文档记录）
#
# 本文件在运行时不被解析，不引入 PyYAML 依赖；代码中的权威定义是
# src/ibme/hibe/abb10.py 中的 ABB10_DEBUG_PARAMS。此文件仅用于按
# IMPLEMENTATION_SPEC.md §2 的要求记录参数来源与安全声明。
#
# security_claim: none
name: hibe-abb10-debug
source: "IB-ME 项目自定的 ABB10 两层 HIBE 调试参数（基于噪声预算启发式选参），非论文推荐参数"
debug_only: true
security_claim: none
expected_security_level: none
fields:
  security_parameter: 8   # 仅为标签，不对应任何安全等级
  n: 8
  m_matrix: 168           # = m_bar(16) + n*k(152)，k = ceil(log2 q) = 19（MP12 结构 A = [A_bar | G]）
  q: 524288               # 2^19
  s0: 3.0                 # trapgen 中主陷门 R 的离散高斯宽度（调试值）
  s: 1.0                  # 加密侧高斯噪声宽度 e1/e2（调试值）
  s_prime: 1.0            # 原像采样误差宽度（调试值）
  identity_bytes: 16
  max_message_bytes: 32
noise_budget: |
  中心化分解位方差 1/2，α = sqrt(nk/2) ≈ 8.72：
  - R1 主导行 std ≈ sqrt((nk/2)*s0^2 + s_prime^2) ≈ 26
  - R2 主导行 std ≈ s0*α^2 ≈ 228
  - 解密原像 x 主导行 std ≈ s0*α^3 ≈ 1990，||x||_2 ≈ 8e3（实测 6.7e3–1.0e4）
  - 每比特解密噪声 e1_j - <x, e2^(j)> 的 std ≈ 8e3（v2 起每个比特有
    独立的 e2^(j)，噪声在比特间独立、量级不变）
  - 解码阈值 q/4 = 131072 ≈ 16σ（实测最差 trial 约 12.5σ）
  均为启发式估计；原像采样为无扰动简化分布，不用于任何安全声明。
rationale: |
  lattice/params.py 的 EDUCATION_PARAMS (n=8, q=257) 噪声预算不足以支撑
  LWE 解码（委派链范数远超 q/4），故 HIBE 层自带更大的调试模数 q=2^19。
  该选择只保证功能正确性，未经任何格安全估计。
ciphertext_v2: |
  P0 整改（2026-09）：v1 曾让全部明文比特共享同一 (s, e2)，c1_j − c1_0
  消去公共 u·s 掩码后按明文比特完美双簇聚类，已知任一明文比特即可无
  密钥恢复完整明文（外部审查复现确认）。v2 起每个比特 j 独立采样
  s_j（均匀，公开随机量）、e2^(j)、e1_j（真离散高斯）：
  c2^(j) = B^T·s_j + e2^(j)，c1_j = u·s_j + e1_j + bit_j·⌊q/2⌉。
  如实代价：每比特一条完整 LWE 样本，密文 ≈ bit_count × (m+2nk+1) 个
  Z_q 系数（本参数 473×3 = 1419 字节/比特），encrypt 时间按比特数线性
  放大；序列化 magic 升级为 v2，v1 对象 from_bytes 一律拒绝。
identity_bytes_semantics: |
  identity_bytes 是身份的最大字节长度（主 AI 冻结语义，SPEC §2）：
  abb10 后端的 extract/derive/encrypt 身份入口及 sk 构造/反序列化均
  强制该上限。mock 后端按主 AI 同期裁定不读取也不强制该字段（与
  protocol 层 BASELINE_MOCK_PARAMS.identity_bytes=8 存在未解决的规范
  冲突），保持"非空 bytes"语义。
limitations:
  - "维度远低于任何可证明安全的格参数，仅为了让纯 Python 功能测试在分钟级完成"
  - "未运行任何 LWE/SIS 格安全估计器，没有安全等级结论"
  - "不得用于任何安全声明、性能宣称或生产部署"
  - "原像采样为 hibe 层零均值化的简化实现（无 MP12 扰动），分布未达证明级"
  - "H(id) 为 ROM 风格 SHAKE-256 哈希矩阵，非 ABB10 论文标准模型构造；身份矩阵未与 mpk 绑定"
  - "逐比特独立采样只修复共享掩码的结构性泄漏；HIBE 层不提供 CCA/完整性（协议层由 IBS 兜底）"
notes:
  - "参数权威定义在代码中；修改参数必须同步更新本文件与 abb10.py 模块 docstring 的噪声预算"
  - "接近实用的参数必须先完成参数估计，再单独成文件并给出安全声明"
  - "密文尺寸与 encrypt 耗时的基准口径由主 AI 在合并 v2 后统一重测"
