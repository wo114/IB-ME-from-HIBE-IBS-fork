name: Basic checks and known gaps

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      strict_security:
        description: Enforce security targets (legacy education instance fails)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  basic-checks:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install test dependencies
        run: python -m pip install -e . pytest==9.1.1
      - name: Run basic checks and report known security gaps
        run: >-
          python -m pytest -p no:cacheprovider -ra --tb=short
          tests/test_encoding.py tests/test_lattice_core.py
          tests/test_prepared_hashing.py tests/test_known_security_gaps.py
          tests/test_luo_matrix_reference.py
          tests/test_luo_ibs_contract.py tests/test_luo_parameter_screen.py
          tests/test_luo_joint_parameters.py
          tests/test_luo_module_math.py tests/test_luo_module_backend.py
          tests/test_luo_module_security_screen.py
          tests/test_luo_module_codec.py
          tests/test_candidate_foundations.py
          tests/test_yu_homomorphic_reference.py
          tests/test_srgg_algebra.py tests/test_srgg_geometry.py
          tests/test_srgg_sampling.py
          tests/test_cli_state_lock.py
          tests/test_byteauth.py
          --junitxml=test-results/basic.xml
      - name: Enforce security targets when explicitly requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.strict_security }}
        run: >-
          python -m pytest -p no:cacheprovider --runxfail -ra --tb=short
          tests/test_known_security_gaps.py
          --junitxml=test-results/strict-security.xml
      - name: Explain validation scope
        if: always()
        shell: pwsh
        run: |
          @'
          ## Validation scope
          This job checks selected Windows basics, Luo research accounting, byte authentication, and the original three security targets.
          **XFAIL means an unfixed vulnerability, not a security pass.**
          Strict XPASS requires reviewing a changed result and removing its XFAIL marker.
          Run with `strict_security=true` to enforce these targets; the education instance currently fails.
          The c1 low-bit tamper target now passes through the default byte-authenticated version; two insecure-IBS authentication targets remain XFAIL.
          The unwrapped tolerance and wrapped public-IBS forgery remain explicit negative controls, not security successes.
          This is not the full protocol suite, Sage research validation, Lean compilation, or a security proof.
          The Luo reference uses hand-selected research parameters and includes an accepted toy forgery control.
          The module backend runs the exact 38-bit research modulus and public-only Verify, including strict object formats and Hint boundaries; it is not registered as the default CLI IBS.
          Module admission tests check exact Hint/fork bounds and conditional nonzero controls. Pinned Sage cost estimates and oracle assumptions are separate; no security grade follows from these checks.
          MODULE-COMPACT/1 checks lossless mathematical/hash-input equivalence and strict canonical decoding. It changes transport size, not security parameters or the algorithm count.
          Candidate handoff tests validate sources, metadata boundaries and Sageloli counting units. Candidate entries are not implemented/admitted backends; Sage algebra prerequisites run separately.
          Yu component tests check binary-gadget NAND equations, matching circuits and exact integer witnesses. The paper's spectral bound, real PRF and full IBS are not implemented/admitted by this reference.
          SRGG component checks cover module relations, HNF correction, commitment recovery and exact shape/Schur positivity. Deterministic digits are not Gaussian sampling; sampler-width and underlying security conditions remain pending.
          SRGG random-gadget tests require Sage and are explicitly skipped on this Windows job. Local Sage checks cover finite Gaussian draws, width mapping, coset-normalizer bias and aborts; correlated perturbation and a complete IBS remain pending.
          Local state lock checks cover contention, bounded failure and release after process exit. These are state-management checks, not cryptographic security evidence.
          Its small functional profiles also admit public master recovery. The external Sage SIS/LWE cost screen and public-only LLL recovery control run separately.
          See the pytest log and JUnit artifact for actual passed, failed, and skipped outcomes.
          '@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-basic-test-results
          path: test-results/*.xml
          if-no-files-found: warn

  hybrid-research:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install research dependencies
        run: python -m pip install -e ".[hybrid]" cryptography==50.0.2 pytest==9.1.1
      - name: Check real hybrid composition and attack controls
        run: >-
          python -m pytest -p no:cacheprovider -ra --tb=short
          tests/test_hybrid_hibe.py tests/test_luo_hybrid_ibme.py
          tests/test_luo_compact_ibme.py
          tests/test_research_state_integrity.py
          tests/test_hybrid_key_binding.py
          --junitxml=test-results/hybrid.xml
      - name: Explain research scope
        if: always()
        shell: pwsh
        run: |
          @'
          ## Hybrid research scope
          This job checks HYBRID-HIBE/1, fixed-width injective identity encoding, the real debug ABB10 + Luo module combination, fresh-process state and attack controls.
          Explicit reference/compact signature formats have separate decoders; both real research paths retain public forgery and recipient re-signing controls.
          Research-state checks enforce fixed HIBE parameter snapshots, serialized identity issuance/cache snapshots, atomic key publication and refusal to overwrite research keys by switching profiles.
          Hybrid key-binding checks require a primitive validator and reject same-parameter public/secret mixups, bad private equations and invalid emitted keys. Algebraic validity does not certify sampling or security.
          All checks are unmarked; there are no security XFAILs in this job.
          The education profile's two vulnerabilities remain explicit XFAILs in the other job.
          A functional real composition is not an admitted secure instance: the HIBE is educational and Luo's parameter/proof mapping is still under review.
          No NIST, CCA, QROM, full anonymity proof or end-to-end optimization claim follows from a green test result.
          '@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload hybrid reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-hybrid-research-test-results
          path: test-results/hybrid.xml
          if-no-files-found: warn
