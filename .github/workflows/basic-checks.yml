name: Basic checks and known gaps

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      strict_security:
        description: Enforce security targets (legacy education instance fails)
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  basic-checks:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.14'
      - name: Install test dependencies
        run: python -m pip install -e . pytest==9.1.1
      - name: Run basic checks and report known security gaps
        run: >-
          python -m pytest -p no:cacheprovider -ra --tb=short
          tests/test_encoding.py tests/test_lattice_core.py
          tests/test_prepared_hashing.py tests/test_known_security_gaps.py
          tests/test_luo_matrix_reference.py
          tests/test_luo_ibs_contract.py tests/test_luo_parameter_screen.py
          tests/test_luo_joint_parameters.py
          tests/test_luo_module_math.py tests/test_luo_module_backend.py
          tests/test_byteauth.py
          --junitxml=test-results/basic.xml
      - name: Enforce security targets when explicitly requested
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.strict_security }}
        run: >-
          python -m pytest -p no:cacheprovider --runxfail -ra --tb=short
          tests/test_known_security_gaps.py
          --junitxml=test-results/strict-security.xml
      - name: Explain validation scope
        if: always()
        shell: pwsh
        run: |
          @'
          ## Validation scope
          This job checks selected Windows basics, Luo research accounting, byte authentication, and the original three security targets.
          **XFAIL means an unfixed vulnerability, not a security pass.**
          Strict XPASS requires reviewing a changed result and removing its XFAIL marker.
          Run with `strict_security=true` to enforce these targets; the education instance currently fails.
          The c1 low-bit tamper target now passes through the default byte-authenticated version; two insecure-IBS authentication targets remain XFAIL.
          The unwrapped tolerance and wrapped public-IBS forgery remain explicit negative controls, not security successes.
          This is not the full protocol suite, Sage research validation, Lean compilation, or a security proof.
          The Luo reference uses hand-selected research parameters and includes an accepted toy forgery control.
          The module backend runs the exact 38-bit research modulus and public-only Verify, including strict object formats and Hint boundaries; it is not registered as the default CLI IBS.
          Its small functional profiles also admit public master recovery. The external Sage SIS/LWE cost screen and public-only LLL recovery control run separately.
          See the pytest log and JUnit artifact for actual passed, failed, and skipped outcomes.
          '@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-basic-test-results
          path: test-results/*.xml
          if-no-files-found: warn
