[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibme"
version = "0.1.0"
description = "Identity-Based Match Encryption from two-level lattice HIBE and SIS-IBS (reference implementation)"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]
hybrid = ["cryptography>=49.0.0,<51"]

[tool.setuptools]
include-package-data = false
package-dir = { "ibme" = "src/ibme", "experiments" = "experiments" }

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["ibme*", "experiments", "experiments.research", "experiments.research.first_suite"]
namespaces = true

[tool.setuptools.package-data]
"ibme.hibe.latte" = ["native/*.c", "native/upstream/*", "native/compat/libXKCP.a.headers/*.h"]

[tool.pytest.ini_options]
testpaths = ["tests"]
